# Dev build: started by hand only (GitHub "Actions" tab -> release-dev ->
# "Run workflow", or `gh workflow run release-dev.yml`). Runs the checks,
# then builds the image for linux/amd64 and linux/arm64 from the chosen
# branch (default master) and pushes it to ghcr.io/mb512/stackbelay:dev.
#
# The "dev" tag floats: every run moves it to the newest build. No git tag,
# no version number, no GitHub release. The binaries report the version
# "dev-<short commit>" so the UI shows which commit is running.
name: release-dev

on:
  workflow_dispatch:

permissions:
  contents: read

# A newer run replaces one that is still building.
concurrency:
  group: release-dev
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=dev-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mb512/stackbelay
          tags: |
            type=raw,value=dev
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
