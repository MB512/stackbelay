# Checks on every push to master and on pull requests: the same commands
# as before a local commit (see CLAUDE.md).
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_call: # reused by the release workflow

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install restic (integration tests)
        run: sudo apt-get update && sudo apt-get install -y restic
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -race -tags integration ./internal/restic/
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  image:
    # The release image must keep building (not pushed here).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
