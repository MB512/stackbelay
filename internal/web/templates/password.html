{{define "content"}}
<h1>Change password</h1>
{{if .User.MustChangePassword}}
<p class="warning">You are using a generated password. Set your own password to continue.</p>
{{end}}
<form method="post" action="/account/password" class="card">
  <input type="hidden" name="csrf_token" value="{{.CSRF}}">
  <label>Current password <input name="current" type="password" autocomplete="current-password" required></label>
  <label>New password (at least 12 characters)
    <input name="new" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label>
  <label>Repeat new password
    <input name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label>
  <button type="submit">Change password</button>
</form>
{{end}}
