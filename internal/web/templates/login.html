{{define "content"}}
<h1>Log in</h1>
<form method="post" action="/login" class="card">
  <label>Username <input name="username" autocomplete="username" required autofocus value="{{.Data}}"></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit">Log in</button>
</form>
<p class="hint">First start? The password of user <code>admin</code> is shown in the container log
(<code>docker logs</code>).</p>
{{end}}
